<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D38" />
      <stop offset="50%" stop-color="#0F2D54" />
      <stop offset="100%" stop-color="#155196" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="heroOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D38" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#155196" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071D38" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyGrad)" />

  <!-- Distant Mountains/Hills -->
  <path d="M0,420 Q240,360 480,390 T960,370 T1200,410 L1200,675 L0,675 Z" fill="#93C5FD" opacity="0.3" />
  <path d="M0,450 Q360,400 720,430 T1200,440 L1200,675 L0,675 Z" fill="#60A5FA" opacity="0.25" />

  <!-- University Quad Lawn -->
  <path d="M0,480 Q600,440 1200,480 L1200,675 L0,675 Z" fill="url(#lawnGrad)" />

  <!-- Diagonal Campus Stone Walkway -->
  <polygon points="150,675 420,675 680,480 620,480" fill="url(#pathGrad)" opacity="0.9" />
  <polygon points="1050,675 780,675 620,480 680,480" fill="url(#pathGrad)" opacity="0.75" />

  <!-- Collegiate Academic Hall / Library (Center-Left) -->
  <g filter="url(#shadow)">
    <!-- Main Classical / Modern Hybrid Façade -->
    <rect x="220" y="240" width="340" height="240" fill="url(#buildingGrad)" rx="6" />
    <!-- Classical Portico / Pediment -->
    <polygon points="390,160 210,240 570,240" fill="#0B2C54" />
    <!-- Clock Tower / Spire -->
    <rect x="360" y="70" width="60" height="100" fill="#071D38" />
    <polygon points="390,20 350,70 430,70" fill="#0284C7" />
    <!-- Clock Face -->
    <circle cx="390" cy="115" r="16" fill="#F8FAFC" />
    <circle cx="390" cy="115" r="14" fill="#FFFFFF" stroke="#071D38" stroke-width="2" />
    <line x1="390" y1="115" x2="390" y2="106" stroke="#071D38" stroke-width="2" stroke-linecap="round" />
    <line x1="390" y1="115" x2="397" y2="115" stroke="#071D38" stroke-width="2" stroke-linecap="round" />

    <!-- Colonnade Columns -->
    <rect x="250" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />
    <rect x="300" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />
    <rect x="350" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />
    <rect x="412" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />
    <rect x="462" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />
    <rect x="512" y="260" width="18" height="220" fill="#E2E8F0" rx="3" />

    <!-- Glass Windows behind Columns -->
    <rect x="272" y="280" width="24" height="60" fill="url(#glassGrad)" rx="2" />
    <rect x="322" y="280" width="24" height="60" fill="url(#glassGrad)" rx="2" />
    <rect x="434" y="280" width="24" height="60" fill="url(#glassGrad)" rx="2" />
    <rect x="484" y="280" width="24" height="60" fill="url(#glassGrad)" rx="2" />
    <rect x="272" y="370" width="24" height="70" fill="url(#glassGrad)" rx="2" />
    <rect x="322" y="370" width="24" height="70" fill="url(#glassGrad)" rx="2" />
    <rect x="434" y="370" width="24" height="70" fill="url(#glassGrad)" rx="2" />
    <rect x="484" y="370" width="24" height="70" fill="url(#glassGrad)" rx="2" />

    <!-- Main Hall Grand Entrance -->
    <rect x="375" y="390" width="30" height="90" fill="#071D38" rx="15" />
    <rect x="380" y="395" width="20" height="85" fill="#38BDF8" opacity="0.7" rx="10" />
  </g>

  <!-- Modern Science & Student Union Pavilion (Right) -->
  <g filter="url(#shadow)">
    <rect x="620" y="200" width="420" height="280" fill="#0F2D54" rx="8" />
    <!-- Modern Glass Curtain Walls with Panels -->
    <rect x="640" y="220" width="380" height="240" fill="url(#glassGrad)" rx="4" />
    <!-- Horizontal & Vertical mullions -->
    <line x1="640" y1="280" x2="1020" y2="280" stroke="#071D38" stroke-width="3" />
    <line x1="640" y1="340" x2="1020" y2="340" stroke="#071D38" stroke-width="3" />
    <line x1="640" y1="400" x2="1020" y2="400" stroke="#071D38" stroke-width="3" />
    <line x1="735" y1="220" x2="735" y2="460" stroke="#071D38" stroke-width="3" />
    <line x1="830" y1="220" x2="830" y2="460" stroke="#071D38" stroke-width="3" />
    <line x1="925" y1="220" x2="925" y2="460" stroke="#071D38" stroke-width="3" />

    <!-- Architectural Overhang Roof -->
    <polygon points="600,200 1060,200 1040,180 620,180" fill="#0284C7" />
  </g>

  <!-- Trees & Foliage -->
  <!-- Left Tree -->
  <ellipse cx="140" cy="460" rx="45" ry="70" fill="#065F46" />
  <ellipse cx="160" cy="430" rx="55" ry="85" fill="#059669" />
  <ellipse cx="120" cy="440" rx="40" ry="60" fill="#10B981" />
  <rect x="145" y="510" width="14" height="80" fill="#78350F" rx="2" />

  <!-- Center-Right Tree -->
  <ellipse cx="590" cy="450" rx="40" ry="65" fill="#065F46" />
  <ellipse cx="600" cy="425" rx="50" ry="75" fill="#059669" />
  <ellipse cx="575" cy="440" rx="35" ry="55" fill="#10B981" />
  <rect x="588" y="490" width="12" height="70" fill="#78350F" rx="2" />

  <!-- Right Tree -->
  <ellipse cx="1090" cy="470" rx="45" ry="70" fill="#065F46" />
  <ellipse cx="1110" cy="440" rx="55" ry="80" fill="#059669" />
  <rect x="1100" y="520" width="14" height="70" fill="#78350F" rx="2" />

  <!-- Students Walking on Path (Stylized Silhouette Figures) -->
  <!-- Student 1 (Backpack, Left Path) -->
  <circle cx="490" cy="540" r="10" fill="#071D38" />
  <path d="M480,555 Q490,550 500,555 L502,595 L494,595 L492,625 L484,625 L488,595 L478,595 Z" fill="#155196" />
  <!-- Backpack -->
  <rect x="474" y="555" width="10" height="22" rx="4" fill="#0284C7" />

  <!-- Student 2 (Carrying Tablet/Binder, Center) -->
  <circle cx="535" cy="535" r="9.5" fill="#071D38" />
  <path d="M526,550 Q535,545 544,550 L546,590 L538,590 L536,620 L528,620 L532,590 L524,590 Z" fill="#059669" />

  <!-- Student 3 (Right Walkway, Talking) -->
  <circle cx="720" cy="550" r="10" fill="#071D38" />
  <path d="M710,565 Q720,560 730,565 L732,605 L724,605 L722,635 L714,635 L718,605 L708,605 Z" fill="#D97706" />

  <!-- Ambient Light / Vignette Gradient Overlay -->
  <rect width="1200" height="675" fill="url(#heroOverlay)" mix-blend-mode="multiply" />
</svg>
