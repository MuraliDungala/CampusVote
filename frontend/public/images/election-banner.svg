<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D38" />
      <stop offset="60%" stop-color="#0B2C54" />
      <stop offset="100%" stop-color="#155196" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#030E1C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bannerBg)" rx="16" />

  <!-- Geometric Abstract Polygons -->
  <circle cx="700" cy="80" r="140" fill="#0284C7" opacity="0.12" />
  <circle cx="100" cy="380" r="180" fill="#2563EB" opacity="0.1" />
  <polygon points="650,20 780,160 580,180" fill="#38BDF8" opacity="0.08" />

  <!-- Subtle Grid Lines -->
  <path d="M0,75 L800,75 M0,150 L800,150 M0,225 L800,225 M0,300 L800,300 M0,375 L800,375" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  <path d="M100,0 L100,450 M200,0 L200,450 M300,0 L300,450 M400,0 L400,450 M500,0 L500,450 M600,0 L600,450 M700,0 L700,450" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Isometric / 3D Stylized Ballot Box -->
  <g transform="translate(480, 110)" filter="url(#cardShadow)">
    <!-- Box Base -->
    <polygon points="120,80 220,130 220,250 120,200" fill="#CBD5E1" />
    <polygon points="20,130 120,80 120,200 20,250" fill="#E2E8F0" />
    <polygon points="120,80 20,130 120,180 220,130" fill="url(#boxGrad)" />

    <!-- Ballot Slot on Top Lid -->
    <polygon points="90,120 150,90 145,95 85,125" fill="#071D38" />

    <!-- Sealed Official Emblem -->
    <circle cx="70" cy="190" r="24" fill="#0284C7" />
    <path d="M60,190 L67,197 L80,183" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Paper Ballot Entering Slot -->
    <polygon points="95,50 145,25 155,90 105,115" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <!-- Checkmark on Ballot -->
    <path d="M115,70 L123,76 L137,62" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left Content: Typography & Badges -->
  <g transform="translate(60, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <text x="80" y="18" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">COLLEGIATE ELECTION</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Campus Democracy</text>
    <text x="0" y="106" fill="url(#accentGrad)" font-family="Inter, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">In Real Time</text>

    <!-- Description -->
    <text x="0" y="145" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14" font-weight="400">Smart ID verification • Zero-linkage ballot vault</text>
    <text x="0" y="168" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14" font-weight="400">Tamper-evident cryptographic results</text>

    <!-- Trust Tags -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#071D38" stroke="#1E3A8A" stroke-width="1" />
      <text x="55" y="17" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">✓ One Voter One Vote</text>

      <rect x="120" y="0" width="115" height="26" rx="6" fill="#071D38" stroke="#1E3A8A" stroke-width="1" />
      <text x="177" y="17" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">✓ 100% Secret Ballot</text>
    </g>
  </g>
</svg>
