# ==============================================================================
# Smart ID-Based College Voting System - Local Infrastructure
# PostgreSQL 15 & Redis 7.2 Services
# ==============================================================================
version: '3.8'

services:
  # Primary Relational Store: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: campusvote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusvote_db}
      POSTGRES_USER: ${DB_USER:-campusvote_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-development_password_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind strictly to localhost (127.0.0.1) to prevent external exposure
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campusvote_user} -d ${DB_NAME:-campusvote_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ephemeral Cache & WebSocket Channel Layer: Redis 7.2
  redis:
    image: redis:7.2-alpine
    container_name: campusvote_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Bind strictly to localhost (127.0.0.1) to prevent external exposure
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
