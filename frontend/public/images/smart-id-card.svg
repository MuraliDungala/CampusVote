<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D38" />
      <stop offset="60%" stop-color="#0F2D54" />
      <stop offset="100%" stop-color="#155196" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="cardElevation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071D38" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#cardElevation)">
    <!-- ID Card Outer Border -->
    <rect x="30" y="25" width="540" height="330" rx="18" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Top Institutional Header -->
    <rect x="30" y="25" width="540" height="65" rx="18" fill="#030E1C" fill-opacity="0.6" />
    <!-- Campus Logo Mark -->
    <circle cx="65" cy="58" r="18" fill="#0284C7" />
    <path d="M57,58 L63,64 L73,52" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="95" y="53" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">UNIVERSITY OF TECHNOLOGY</text>
    <text x="95" y="70" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">OFFICIAL STUDENT SMART ID</text>

    <!-- Smart EMV Chip -->
    <rect x="65" y="115" width="52" height="42" rx="6" fill="url(#chipGrad)" stroke="#B45309" stroke-width="1" />
    <line x1="65" y1="136" x2="117" y2="136" stroke="#B45309" stroke-width="0.8" />
    <line x1="91" y1="115" x2="91" y2="157" stroke="#B45309" stroke-width="0.8" />
    <rect x="79" y="127" width="24" height="18" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="0.8" />

    <!-- Contactless Wi-Fi Waves -->
    <path d="M135,125 A12,12 0 0,1 135,145" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M142,120 A20,20 0 0,1 142,150" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M149,115 A28,28 0 0,1 149,155" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Student Photo Box -->
    <g transform="translate(400, 110)">
      <rect x="0" y="0" width="130" height="150" rx="10" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />
      <!-- Silhouette avatar -->
      <circle cx="65" cy="55" r="30" fill="#94A3B8" />
      <path d="M25,130 C25,95 45,85 65,85 C85,85 105,95 105,130 Z" fill="#94A3B8" />
      <rect x="10" y="132" width="110" height="12" rx="4" fill="#0284C7" />
      <text x="65" y="141" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">VERIFIED VOTER</text>
    </g>

    <!-- Student Metadata -->
    <g transform="translate(65, 185)">
      <text x="0" y="0" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">STUDENT NAME</text>
      <text x="0" y="20" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="17" font-weight="700">Aarav Sharma</text>

      <text x="0" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">COLLEGE REGISTRATION ID</text>
      <text x="0" y="68" fill="#38BDF8" font-family="Inter, monospace" font-size="16" font-weight="700">CS2026001</text>

      <text x="0" y="96" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">DEPARTMENT &amp; YEAR</text>
      <text x="0" y="114" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="13" font-weight="500">Computer Science • Class of 2026</text>
    </g>

    <!-- Barcode Strip at Bottom -->
    <g transform="translate(65, 315)">
      <rect x="0" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="8" y="0" width="8" height="24" fill="#E2E8F0" />
      <rect x="20" y="0" width="3" height="24" fill="#E2E8F0" />
      <rect x="27" y="0" width="6" height="24" fill="#E2E8F0" />
      <rect x="37" y="0" width="2" height="24" fill="#E2E8F0" />
      <rect x="43" y="0" width="7" height="24" fill="#E2E8F0" />
      <rect x="54" y="0" width="3" height="24" fill="#E2E8F0" />
      <rect x="61" y="0" width="5" height="24" fill="#E2E8F0" />
      <rect x="70" y="0" width="8" height="24" fill="#E2E8F0" />
      <rect x="82" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="90" y="0" width="6" height="24" fill="#E2E8F0" />
      <rect x="100" y="0" width="3" height="24" fill="#E2E8F0" />
      <rect x="107" y="0" width="8" height="24" fill="#E2E8F0" />
      <rect x="119" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="127" y="0" width="6" height="24" fill="#E2E8F0" />
      <rect x="137" y="0" width="2" height="24" fill="#E2E8F0" />
      <rect x="143" y="0" width="8" height="24" fill="#E2E8F0" />
      <rect x="155" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="163" y="0" width="6" height="24" fill="#E2E8F0" />
      <rect x="173" y="0" width="3" height="24" fill="#E2E8F0" />
      <rect x="180" y="0" width="7" height="24" fill="#E2E8F0" />
      <rect x="191" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="199" y="0" width="6" height="24" fill="#E2E8F0" />
      <rect x="210" y="0" width="4" height="24" fill="#E2E8F0" />
      <rect x="218" y="0" width="8" height="24" fill="#E2E8F0" />
      <rect x="230" y="0" width="3" height="24" fill="#E2E8F0" />
    </g>
  </g>
</svg>
