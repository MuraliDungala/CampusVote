services:
  # ==============================================================================
  # CampusVote Backend Service (Django REST Framework + Daphne ASGI)
  # ==============================================================================
  - type: web
    name: campusvote-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusvote-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: CHANNEL_LAYER_BACKEND
        value: "channels.layers.InMemoryChannelLayer"
      - key: MONITORING_PRIVACY_SUPPRESSION_THRESHOLD
        value: "5"
      - key: VERIFICATION_DELIVERY_PROVIDER
        value: "email"
      - key: DEFAULT_FROM_EMAIL
        value: "CampusVote Election Authority <noreply@campusvote.edu>"

databases:
  # ==============================================================================
  # Managed PostgreSQL Database for Multi-Tenant CampusVote Records
  # ==============================================================================
  - name: campusvote-db
    plan: free
    region: oregon
    databaseName: campusvote_db
    user: campusvote_user
